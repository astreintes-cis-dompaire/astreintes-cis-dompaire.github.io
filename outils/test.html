<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Astreintes : pompiers fictifs</title>
<link rel="stylesheet" href="../styles.css">
<style>
  .outil { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  .outil .btn { margin: 6px 8px 6px 0; }
  #etat { margin-top: 18px; font-weight: 600; }
</style>
</head>
<body>
<div class="outil">
  <h1>Pompiers fictifs pour tester</h1>
  <p>Ajoute 45 pompiers inventés, avec leurs compétences et leurs dispos de la période ouverte. Ils sont marqués « fictifs » et s’effacent d’un clic, sans toucher aux vrais.</p>
  <button id="connexion" class="btn btn-primaire">Se connecter avec Google</button>
  <div id="connecte" hidden>
    <p>Connecté : <span id="qui"></span></p>
    <button id="remplir" class="btn btn-primaire">Créer les 45 pompiers fictifs</button>
    <button id="effacer" class="btn">Effacer les pompiers fictifs</button>
  </div>
  <p id="etat"></p>
  <p><a href="../#chef">Retour à l’espace chef</a></p>
</div>
<script src="../config.js"></script>
<script type="module" src="remplir-test.js"></script>
</body>
</html>
