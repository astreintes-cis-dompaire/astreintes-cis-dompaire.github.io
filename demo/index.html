<style>/* Astreintes — deux écrans : colonne unique « fiche » côté pompier (téléphone),
   barre + onglets + tableau à 8 créneaux côté chef (1re colonne collante). */
:root {
  --fond: #EDF0F3;
  --surface: #FFFFFF;
  --creux: #E2E7ED;
  --encre: #121B25;
  --discret: #566273;
  --trait: #D0D7DF;
  --marine: #1C3657;        /* bleu tenue : actions, astreintes */
  --marine-texte: #FFFFFF;
  --marine-doux: #DCE5F0;
  --tete: #1C3657;          /* bandeaux du haut sur téléphone */
  --tete-texte: #FFFFFF;
  --signal: #C62828;        /* rouge engin : marque et manques */
  --signal-doux: #FBE3E1;
  --ok: #16744A;
  --ok-doux: #DAF0E3;
  --attention: #9A5A00;
  --attention-doux: #FAEBD3;
  --sur-signal: #FFFFFF;    /* texte posé sur le rouge ou l'orange */
  --ombre: 0 1px 2px rgba(18, 27, 37, .06), 0 4px 14px rgba(18, 27, 37, .06);
  --f-titre: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --f-texte: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --rayon: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #0D131A; --surface: #151D27; --creux: #1C2633; --encre: #E6EBF1; --discret: #94A2B3; --trait: #2A3646;
    --marine: #8FB5E3; --marine-texte: #0D131A; --marine-doux: #1D2F47;
    --signal: #F06A62; --signal-doux: #3A1D1D; --ok: #52C98F; --ok-doux: #15322A; --attention: #E7A84F; --attention-doux: #36290F;
    --tete: #182A42; --tete-texte: #E6EBF1; --sur-signal: #160A0A;
    --ombre: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #0D131A; --surface: #151D27; --creux: #1C2633; --encre: #E6EBF1; --discret: #94A2B3; --trait: #2A3646;
  --marine: #8FB5E3; --marine-texte: #0D131A; --marine-doux: #1D2F47;
  --signal: #F06A62; --signal-doux: #3A1D1D; --ok: #52C98F; --ok-doux: #15322A; --attention: #E7A84F; --attention-doux: #36290F;
    --tete: #182A42; --tete-texte: #E6EBF1; --sur-signal: #160A0A;
  --ombre: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--fond); color: var(--encre);
  font-family: var(--f-texte); font-size: 16px; line-height: 1.45;
  font-variant-numeric: tabular-nums;
}
h1, h2, h3 { font-family: var(--f-titre); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: .005em; }
p { margin: 0; }
a { color: var(--marine); }
code { font-size: .92em; background: var(--creux); padding: 1px 5px; border-radius: 4px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--marine); outline-offset: 2px; }
[hidden] { display: none !important; }
.ico { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; }
.visuel-cache { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.chargement { padding: 48px 0; color: var(--discret); text-align: center; }
.surtitre { font-family: var(--f-titre); font-weight: 600; font-size: .78rem; letter-spacing: .09em; text-transform: uppercase; color: var(--discret); }
.facultatif { font-weight: 400; color: var(--discret); font-size: .85em; }
.aide { color: var(--discret); font-size: .88rem; }
.erreur { color: var(--signal); font-size: .9rem; }
.muet { color: var(--discret); }
.txt-ok { color: var(--ok); font-weight: 600; }
.txt-probleme { color: var(--signal); font-weight: 600; }
.sur { color: var(--discret); font-weight: 500; font-size: .7em; }

/* Marque : carré rouge + mot en capitales serrées */
.marque { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-titre); }
.marque-logo { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 0 2px var(--signal); }
.marque-mot { font-weight: 700; font-size: .95rem; letter-spacing: .14em; text-transform: uppercase; }
.marque-centre { font-weight: 600; font-size: .95rem; color: var(--discret); padding-left: 8px; border-left: 1px solid var(--trait); }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 8px 14px; border-radius: var(--rayon);
  border: 1px solid var(--trait); background: var(--surface); color: var(--encre);
  font-weight: 600; font-size: .95rem; cursor: pointer; text-align: center;
  transition: background-color .15s, border-color .15s;
}
.btn:hover:not(:disabled) { border-color: var(--discret); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primaire { background: var(--marine); border-color: var(--marine); color: var(--marine-texte); }
.btn-primaire:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--marine); }
.btn-accent { border-color: var(--marine); color: var(--marine); }
.btn-danger { background: var(--signal); border-color: var(--signal); color: var(--sur-signal); }
.btn-danger-texte { color: var(--signal); border-color: transparent; background: transparent; padding-inline: 4px; }
.btn-lien { border: 0; background: none; padding: 0; min-height: 0; color: var(--marine); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-size: inherit; }
.btn-petit { min-height: 32px; padding: 4px 10px; font-size: .85rem; }
.btn-large { min-height: 52px; width: 100%; font-size: 1rem; }
.btn-icone { min-height: 34px; width: 34px; padding: 0; }

/* ---------- Pastilles, puces ---------- */
.pastille { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; background: var(--creux); color: var(--discret); white-space: nowrap; }
.pastille-ok { background: var(--ok-doux); color: var(--ok); }
.pastille-accent { background: var(--marine-doux); color: var(--marine); }
.puces { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.puce {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 5px 12px;
  border-radius: 999px; border: 1px solid var(--trait); background: var(--surface); cursor: pointer; font-weight: 500; font-size: .9rem;
}
.puce.on { background: var(--marine-doux); border-color: var(--marine); color: var(--marine); font-weight: 600; }
.puce.inclus { border-style: dashed; color: var(--discret); }
.puce small { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
.puce-x { border: 0; background: none; padding: 0; margin-left: 2px; cursor: pointer; color: inherit; display: inline-flex; }
.puces-petites .puce { min-height: 28px; padding: 2px 9px; font-size: .78rem; }
.puces select { min-height: 36px; border-radius: 999px; border: 1px dashed var(--trait); background: var(--surface); padding: 4px 12px; }

/* ---------- Champs ---------- */
.champ { display: grid; gap: 6px; min-width: 0; border: 0; padding: 0; margin: 0; }
.champ > label, .champ > legend { font-weight: 600; font-size: .92rem; padding: 0; }
.champ legend { margin-bottom: 6px; }
input:not([type=checkbox]), select, textarea {
  width: 100%; min-height: 42px; padding: 8px 11px; border: 1px solid var(--trait); border-radius: var(--rayon);
  background: var(--surface); color: var(--encre);
}
textarea { resize: vertical; line-height: 1.4; }
input[type=time] { width: auto; min-height: 36px; padding: 4px 8px; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--marine); }
.case { display: flex; align-items: center; gap: 10px; font-weight: 500 !important; }
.grille-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
.ligne-lien { display: flex; gap: 8px; }
.ligne-lien input { min-width: 0; }

/* =================== ÉCRAN POMPIER =================== */
.pp { max-width: 560px; margin: 0 auto; padding: 18px 16px 110px; display: grid; gap: 22px; }
.pp-tete { display: grid; gap: 6px; }
.pp-tete-ligne { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.pp-nom { font-size: 2.1rem; margin-top: 10px; }
.pp-grade { color: var(--discret); font-weight: 500; }
.pp-message { margin-top: 10px; background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 10px 14px; display: grid; gap: 2px; }
.pp-message-de { font-family: var(--f-titre); font-weight: 600; font-size: .75rem; letter-spacing: .09em; text-transform: uppercase; color: var(--discret); }
.pp-section { display: grid; gap: 12px; }
.pp-titre { font-size: 1.3rem; }
.pp-periode-titre { font-size: 1.6rem; margin-top: 2px; }
.pp-limite { color: var(--discret); display: flex; gap: 8px; align-items: flex-start; }
.pp-limite strong { color: var(--encre); }
.pp-saisie { gap: 16px; }

.astreintes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.astreinte { background: var(--marine); color: var(--marine-texte); border-radius: var(--rayon); padding: 12px 14px; display: grid; gap: 2px; position: relative; }
.astreinte-type { font-family: var(--f-titre); font-weight: 700; font-size: 1.15rem; }
.astreinte-quand { font-size: .95rem; opacity: .92; }
.astreinte .pastille { position: absolute; top: 10px; right: 10px; background: var(--marine-texte); color: var(--marine); }

.semaines { display: grid; gap: 14px; }
.sem { display: grid; gap: 8px; }
.sem-tete { font-family: var(--f-titre); font-weight: 600; font-size: .95rem; color: var(--discret); display: grid; gap: 0; padding-top: 6px; }
.sem-num { font-weight: 700; font-size: 1.35rem; color: var(--marine); text-transform: uppercase; letter-spacing: .04em; }
.recap-sem b { color: var(--marine); }
.sem-choix { display: grid; gap: 6px; }
.choix {
  display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; min-height: 48px;
  border-radius: var(--rayon); border: 1.5px solid var(--trait); background: var(--surface); color: var(--encre); cursor: pointer; font: inherit;
  transition: border-color .15s, background-color .15s, transform .1s;
}
.choix:active:not(:disabled) { transform: scale(.99); }
.choix:disabled { cursor: default; opacity: .7; }
.choix-texte { display: grid; gap: 1px; }
.choix-titre { font-family: var(--f-titre); font-weight: 700; font-size: 1.1rem; }
.choix-detail { font-size: .8rem; color: var(--discret); }
.choix-rond { width: 24px; height: 24px; flex: none; border-radius: 50%; border: 1.5px solid var(--trait); display: grid; place-items: center; }
.choix-rond .ico { width: 15px; height: 15px; }
.choix.on { border-color: var(--ok); background: var(--ok-doux); }
.choix.on .choix-rond { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.choix.non { border-color: var(--signal); background: var(--creux); }
.choix.non .choix-rond { background: var(--signal); border-color: var(--signal); }
.sem-num { font-family: var(--f-titre); font-weight: 700; font-size: 1.05rem; letter-spacing: .04em; text-transform: uppercase; }
.sem-plage { color: var(--discret); font-size: .9rem; }
.sem-blocs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bloc {
  display: grid; gap: 6px; text-align: left; padding: 12px 12px 10px; min-height: 118px;
  border-radius: var(--rayon); border: 1.5px solid var(--trait); background: var(--surface); cursor: pointer;
  transition: border-color .15s, background-color .15s, transform .1s;
}
.bloc:active:not(:disabled) { transform: scale(.98); }
.bloc:disabled { cursor: default; opacity: .7; }
.bloc-haut { display: flex; justify-content: space-between; align-items: center; }
.bloc-type { font-family: var(--f-titre); font-weight: 700; font-size: 1.2rem; }
.bloc-coche { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--trait); display: grid; place-items: center; }
.bloc-quand { font-size: .84rem; color: var(--discret); line-height: 1.35; }
.bloc-etat { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--discret); align-self: end; }
.bloc.on { border-color: var(--ok); background: var(--ok-doux); }
.bloc.on .bloc-coche { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.bloc.on .bloc-etat { color: var(--ok); }
.bloc.on .bloc-quand { color: var(--encre); }

.pp-barre {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--trait);
  display: flex; justify-content: center; align-items: center; gap: 8px; text-align: center;
  font-weight: 600; font-size: .92rem; color: var(--discret);
}
.pp-barre.ok { color: var(--ok); }
.pp-barre.attention { color: var(--attention); background: var(--attention-doux); }
.pp-barre.probleme { color: var(--signal); background: var(--signal-doux); }
.rappel-ok { display: flex; gap: 10px; color: var(--ok); font-weight: 500; }
.etapes { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.pp-vide { padding-top: 40px; display: grid; gap: 14px; }
.pp-vide h1 { font-size: 2rem; }

/* =================== ÉCRAN CHEF =================== */
.ch { max-width: 1240px; margin: 0 auto; padding: 0 16px 60px; font-size: 15px; }
.ch-entete { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--fond); padding-top: 14px; display: grid; gap: 12px; border-bottom: 1px solid var(--trait); }
.ch-barre { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.ch-compte { color: var(--discret); font-size: .88rem; }
.ch-periode { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ch-periode-texte { display: grid; line-height: 1.15; }
.ch-periode-texte strong { font-family: var(--f-titre); font-size: 1.45rem; font-weight: 700; }
.onglets { display: flex; gap: 2px; overflow-x: auto; }
.onglet {
  border: 0; background: none; padding: 10px 14px; font-weight: 600; color: var(--discret); cursor: pointer;
  border-bottom: 3px solid transparent; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
}
.onglet.actif { color: var(--encre); border-bottom-color: var(--signal); }
.compte { background: var(--creux); border-radius: 999px; padding: 0 7px; font-size: .78rem; }
.ch-contenu { padding-top: 18px; display: grid; gap: 18px; }

.indicateurs { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); }
.indic { padding: 14px 16px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.indic + .indic { border-left: 1px solid var(--trait); }
.indic-valeur { font-family: var(--f-titre); font-weight: 700; font-size: 1.7rem; line-height: 1.1; display: inline-flex; align-items: center; gap: 6px; }
.indic-valeur.ok { color: var(--ok); }
.indic-valeur.attention { color: var(--attention); font-size: 1.25rem; }
.indic-detail { color: var(--discret); font-size: .88rem; }
.jauge { display: block; height: 6px; background: var(--creux); border-radius: 3px; overflow: hidden; margin: 4px 0 2px; }
.jauge span { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Propositions */
.propositions { display: grid; gap: 12px; padding: 16px; background: var(--marine-doux); border-radius: var(--rayon); }
.propositions-tete { display: flex; justify-content: space-between; align-items: baseline; }
.propositions h2 { font-size: 1.4rem; }
.calcul { font-weight: 600; color: var(--marine); }
.cartes { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.carte { background: var(--surface); border: 1.5px solid var(--trait); border-radius: var(--rayon); padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.carte-active { border-color: var(--marine); box-shadow: var(--ombre); }
.carte h3 { font-size: 1.3rem; }
.carte-desc { color: var(--discret); font-size: .88rem; }
.stats { display: grid; gap: 6px; margin: 0; }
.stats div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--trait); padding-bottom: 5px; }
.stats dt { color: var(--discret); font-size: .88rem; }
.stats dd { margin: 0; font-weight: 700; text-align: right; }
.carte-manques { border: 1px solid var(--signal); background: var(--signal-doux); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; font-size: .88rem; }
.carte-manques summary { cursor: pointer; display: flex; gap: 8px; align-items: flex-start; color: var(--signal); }
.carte-manques summary .ico { margin-top: 2px; }
.manque-bloc { display: grid; gap: 2px; background: var(--surface); border-radius: 8px; padding: 6px 10px; }
.manque-quand { font-family: var(--f-titre); font-weight: 700; font-size: 1rem; }
.manque-quand small { font-family: var(--f-texte); font-weight: 400; font-size: .78rem; color: var(--discret); }
.manque-bloc ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
.manque-bloc li strong { color: var(--signal); }
.manque-bloc li span { color: var(--discret); }
.carte-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.carte-actions .btn { flex: 1 1 auto; }
.encart { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 12px 14px; display: grid; gap: 6px; }
.encart h2 { font-size: 1.35rem; }
.encart ul { margin: 0; padding-left: 18px; }
.notice-competences { margin: 4px 0 12px; border-left: 4px solid var(--marine); }
.notice-competences h3 { margin: 0; font-size: 1rem; }
.notice-competences ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: .9rem; line-height: 1.4; }
.encart-probleme { border-color: var(--signal); background: var(--signal-doux); color: var(--encre); }
.encart-probleme strong { color: var(--signal); }
.bandeau-apercu { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--rayon); background: var(--marine); color: var(--marine-texte); }
.bandeau-apercu .btn:not(.btn-primaire) { background: transparent; color: var(--marine-texte); border-color: currentColor; }
.bandeau-apercu .btn-primaire { background: var(--marine-texte); color: var(--marine); }
.bandeau-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Tableau */
.zone-tableau { display: grid; gap: 10px; min-width: 0; }
.filtres { display: flex; gap: 6px; flex-wrap: wrap; }
.filtre { border: 1px solid var(--trait); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: .84rem; font-weight: 600; cursor: pointer; color: var(--discret); }
.filtre.actif { background: var(--encre); color: var(--fond); border-color: var(--encre); }
.legende { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--discret); align-items: center; }
.legende span { display: inline-flex; align-items: center; gap: 6px; }
.legende-aide { margin-left: auto; font-style: italic; }
.defile { overflow-x: auto; border: 1px solid var(--trait); border-radius: var(--rayon); background: var(--surface); }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
.planning { min-width: 880px; }
.planning th, .planning td { padding: 0; border-bottom: 1px solid var(--trait); text-align: center; }
.planning thead th { font-family: var(--f-titre); font-weight: 600; font-size: .95rem; padding: 8px 4px; background: var(--surface); }
.th-sem { border-left: 1px solid var(--trait); }
.th-sem span, .th-bloc span { display: block; font-family: var(--f-texte); font-weight: 500; font-size: .74rem; color: var(--discret); }
.th-bloc { font-size: .85rem !important; }
.planning td.we { border-left: 1px solid var(--trait); }
.col-nom { position: sticky; left: 0; z-index: 2; background: var(--surface); text-align: left !important; padding: 7px 10px !important; min-width: 210px; max-width: 260px; border-right: 1px solid var(--trait); }
.planning thead .col-nom { z-index: 3; }
.nom-lien { border: 0; background: none; padding: 0; font-weight: 600; cursor: pointer; text-align: left; color: var(--encre); }
.nom-lien:hover { color: var(--marine); text-decoration: underline; }
.nom-meta { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 2px; font-weight: 500; font-size: .8rem; color: var(--discret); }
.nom-commentaire { display: block; font-weight: 400; font-size: .78rem; color: var(--discret); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px; font-style: italic; }
.code { font-family: var(--f-titre); font-weight: 600; font-size: .72rem; letter-spacing: .04em; padding: 1px 5px; border-radius: 4px; background: var(--creux); color: var(--encre); white-space: nowrap; }
.icone-info { display: inline-flex; color: var(--discret); cursor: help; }
.col-total { padding: 6px 10px !important; min-width: 108px; text-align: left !important; border-left: 1px solid var(--trait); }
.total { font-weight: 600; font-size: .85rem; }
.total.ok { color: var(--ok); }
.total.attention { color: var(--attention); }
.total small { font-weight: 500; color: var(--discret); }

.cel {
  width: 100%; min-width: 50px; height: 42px; border: 0; margin: 0; padding: 0; cursor: pointer;
  display: grid; place-items: center; background: transparent; color: var(--discret);
}
.cel.d { background: var(--ok-doux); color: var(--ok); }
.cel.n { background: transparent; }
.cel.x { background: repeating-linear-gradient(135deg, transparent 0 5px, var(--creux) 5px 7px); }
.cel.a { background: var(--marine); color: var(--marine-texte); }
.cel.a.h { box-shadow: inset 0 0 0 3px var(--attention); }
.cel.c { box-shadow: inset 0 0 0 3px var(--signal); }
.cel:hover:not(.a) { outline: 2px solid var(--marine); outline-offset: -2px; }
.apercu .cel { cursor: default; }
.apercu .cel:hover { outline: none; }
.point { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.tiret { width: 10px; height: 2px; background: var(--trait); }
.cel-ex { display: inline-block; width: 16px; height: 16px; border-radius: 3px; border: 1px solid var(--trait); }
.cel-ex.d { background: var(--ok-doux); border-color: var(--ok); }
.cel-ex.n { background: var(--surface); }
.cel-ex.x { background: repeating-linear-gradient(135deg, var(--surface) 0 3px, var(--creux) 3px 5px); }
.cel-ex.a { background: var(--marine); border-color: var(--marine); }
.cel-ex.c { background: var(--surface); border: 3px solid var(--signal); }
tr.flash th, tr.flash td { animation: flash 2.4s ease-out; }
@keyframes flash { 0%, 30% { background-color: var(--attention-doux); } 100% { background-color: transparent; } }
.planning tfoot th, .planning tfoot td { font-size: .82rem; padding: 6px 4px; background: var(--creux); font-weight: 600; }
.planning tfoot .col-nom { background: var(--creux); font-weight: 600; }
.planning tfoot .col-nom .muet { font-weight: 400; font-size: .76rem; }
.pied-effectif td { font-family: var(--f-titre); font-size: 1rem !important; }
.pied-ok { color: var(--ok); }
.pied-manque { color: var(--signal); background: var(--signal-doux) !important; }
.pied-vide { color: var(--trait); }
.vide { padding: 24px !important; color: var(--discret); }

/* Effectif */
.effectif { display: grid; gap: 12px; }
.liste { min-width: 860px; }
.liste th, .liste td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--trait); vertical-align: middle; font-size: .92rem; }
.liste thead th { font-family: var(--f-titre); font-weight: 600; font-size: .9rem; color: var(--discret); text-transform: uppercase; letter-spacing: .05em; }
.liste .col-nom { min-width: 200px; }
.liste td .code { margin-right: 4px; }
.liste th.col-q, .liste td.col-q { text-align: center; padding-inline: 4px; width: 3.2em; }
.liste th.col-q { font-size: .78rem; letter-spacing: .02em; white-space: nowrap; }
.col-q input { width: 22px; height: 22px; margin: 0; accent-color: var(--marine); cursor: pointer; vertical-align: middle; }
.col-q.inclus input { opacity: .45; }
.col-q.inclus { position: relative; }
.col-q.inclus::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--discret); pointer-events: none; }
.incompat { display: inline-flex; gap: 6px; align-items: center; color: var(--signal); font-size: .86rem; }
.col-actions { text-align: right !important; white-space: nowrap; }
.col-actions .btn + .btn { margin-left: 4px; }

/* Réglages */
.reglages { display: grid; gap: 18px; padding-bottom: 70px; }
.bloc-reglage { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.bloc-reglage h2 { font-size: 1.35rem; }
.horaires { display: grid; gap: 10px; }
.horaires > div { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.table-qualifs { min-width: 760px; }
.table-qualifs { border-collapse: separate; border-spacing: 0; }
.table-qualifs th, .table-qualifs td { padding: 7px 8px; border-bottom: 1px solid var(--trait); text-align: left; vertical-align: middle; }
/* Une compétence = une bande bien distincte : fond alterné, filet épais, nom en gras. */
.table-qualifs tbody td { padding-top: 12px; padding-bottom: 12px; border-bottom: 2px solid var(--trait); }
.table-qualifs tbody tr:nth-child(even) td { background: var(--fond); }
.table-qualifs tbody tr td:first-child { border-left: 4px solid var(--encre); }
.table-qualifs tbody tr:nth-child(even) td:first-child { border-left-color: var(--discret); }
.table-qualifs .q-nom input { font-weight: 600; }
.table-qualifs thead th { font-size: .8rem; color: var(--discret); font-weight: 600; }
.table-qualifs input.court { width: 90px; }
.table-qualifs input.nombre { width: 76px; }
.table-qualifs .q-capa { display: block; margin-top: 4px; font-size: .78rem; color: var(--discret); }
.table-qualifs .q-capa.manque { color: var(--signal); font-weight: 600; }
.table-qualifs .sans-objet { display: inline-flex; align-items: center; min-height: 40px; padding: 0 12px; border: 1px dashed var(--trait); border-radius: 10px; color: var(--discret); font-size: .85rem; font-weight: 600; }
.table-qualifs .lien-sans-objet { display: block; margin-top: 4px; border: 0; background: none; padding: 0; font: inherit; font-size: .76rem; color: var(--discret); text-decoration: underline; cursor: pointer; }
.table-qualifs input.invalide { border-color: var(--signal); box-shadow: 0 0 0 1px var(--signal); }
.col-ordre { white-space: nowrap; }
.col-ordre .btn-icone { width: 28px; min-height: 28px; border: 0; }
.ligne-action { display: flex; gap: 8px; flex-wrap: wrap; }
.barre-enregistrer {
  position: sticky; bottom: 0; z-index: 10; display: flex; justify-content: flex-end; align-items: center; gap: 14px;
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--fond); border-top: 1px solid var(--trait);
}
#r-etat { color: var(--attention); font-weight: 600; font-size: .9rem; }

/* Connexion */
.connexion { max-width: 440px; margin: 10vh auto 0; display: grid; gap: 16px; }
.connexion h1 { font-size: 2.2rem; }

/* ---------- Fenêtres, messages ---------- */
.modal-fond { position: fixed; inset: 0; z-index: 50; background: rgba(10, 16, 24, .45); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.modal { width: min(460px, 100%); background: var(--surface); color: var(--encre); border-radius: 12px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); max-height: calc(100vh - 32px); overflow-y: auto; }
.modal-large { width: min(640px, 100%); }
.modal-titre { font-size: 1.6rem; }
.modal-texte { font-size: 1rem; }
.modal-zone { font-family: ui-monospace, monospace; font-size: .85rem; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.modal-actions .espace { flex: 1; }
.fiche { display: grid; gap: 16px; }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: grid; gap: 8px; width: min(440px, calc(100% - 32px)); }
.toast { background: var(--encre); color: var(--fond); padding: 11px 15px; border-radius: var(--rayon); font-weight: 500; font-size: .92rem; box-shadow: var(--ombre); transition: opacity .3s, transform .3s; }
.toast.probleme { background: var(--signal); color: var(--sur-signal); }
.toast.sortie { opacity: 0; transform: translateY(6px); }

/* Bouton clair / sombre */
.btn-theme { gap: 6px; }
.ch-barre .btn-theme { margin-left: auto; }
.pp-tete-boutons { display: flex; gap: 8px; flex-wrap: wrap; }
.pp-tete .btn-theme, .ch-entete .btn-theme { background: transparent; color: inherit; border-color: color-mix(in srgb, currentColor 40%, transparent); }

/* ---------- Démo ---------- */
.demo-haut { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; }
.demo-barre {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 8px 16px; background: #121B25; color: #EDF0F3; font-size: .88rem; border-bottom: 1px solid var(--trait);
}
.demo-barre .btn { background: transparent; color: #EDF0F3; border-color: rgba(255, 255, 255, .35); }
.demo-titre { margin-right: auto; }
.demo-vues { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--trait); box-shadow: var(--ombre); }
.vue-btn {
  --c: var(--marine); --c-doux: var(--marine-doux);
  display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 8px 14px;
  border: 2px solid var(--c); border-radius: var(--rayon); background: var(--c-doux); color: var(--c);
  font: inherit; text-align: left; cursor: pointer; opacity: .75;
}
.vue-btn.vue-chef { --c: var(--signal); --c-doux: var(--signal-doux); }
.vue-btn .ico { width: 26px; height: 26px; flex: none; }
.vue-btn strong { display: block; font-family: var(--f-titre); font-size: 1.25rem; text-transform: uppercase; letter-spacing: .03em; line-height: 1.1; }
.vue-btn small { display: block; font-size: .8rem; font-weight: 600; }
.vue-btn:hover { opacity: 1; }
.vue-btn.actif { background: var(--c); color: var(--fond); opacity: 1; box-shadow: 0 0 0 3px var(--c-doux); cursor: default; }
.demo-choix select { min-height: 32px; padding: 3px 8px; width: auto; max-width: 200px; background: var(--fond); color: var(--encre); border: 0; }
.demo-telephone { max-width: 430px; margin: 18px auto; background: var(--fond); border: 1px solid var(--trait); border-radius: 26px; min-height: 760px; }
.demo-telephone .pp-barre { position: sticky; border-radius: 0 0 26px 26px; }
.demo-telephone .pp { padding-bottom: 20px; }

/* ---------- Petits écrans ---------- */
/* Aperçu du planning à envoyer */
.notif-apercu { display: grid; gap: 2px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--trait); background: var(--creux); }
.notif-app { font-size: .75rem; color: var(--discret); }
.modal-feuille { width: min(1180px, 100%); }
.apercu-tete { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.apercu-messages { display: grid; gap: 10px; }
.apercu-messages summary { cursor: pointer; font-weight: 600; }
.apercu-messages[open] > div { display: grid; gap: 10px; margin-top: 10px; }

/* Planning par semaine : la même feuille à l'écran, dans l'aperçu et en PDF (A4 paysage). */
.par-semaine { display: grid; gap: 12px; }
.par-semaine h2 { font-size: 1.35rem; }
.feuille { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.f-tete { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; border-bottom: 2px solid var(--signal); padding-bottom: 8px; }
.f-tete img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; }
.f-tete h2 { font-size: 1.45rem; line-height: 1.1; }
.f-sous, .f-creneaux, .f-dates, .f-pied { color: var(--discret); font-size: .85rem; }
.f-creneaux { margin-left: auto; text-align: right; }
.f-cols { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
.f-col { border: 1px solid var(--trait); border-radius: var(--rayon); padding: 10px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.f-col h3 { font-size: 1.15rem; line-height: 1; }
.f-dates { margin-top: -6px; }
.f-g { display: grid; gap: 3px; min-width: 0; }
.f-g h4 { font-size: .72rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; border-bottom: 1px solid var(--trait); padding-bottom: 2px; margin: 0; }
.f-g h4 span { color: var(--discret); }
.f-tout h4 { color: var(--marine); }
.f-se h4 { color: var(--ok); }
.f-we h4 { color: var(--attention); }

.prop-onglet { display: grid; gap: 16px; }

.prop-calcul { display: grid; gap: 8px; padding: 16px; border: 1px solid var(--trait); border-radius: var(--rayon); background: var(--surface); }
.route { height: 12px; border-radius: 99px; background: var(--creux); overflow: hidden; }
.route span { display: block; height: 100%; width: 100%; background: repeating-linear-gradient(45deg, var(--signal) 0 12px, var(--signal-doux) 12px 24px); background-size: 34px 100%; animation: route 0.8s linear infinite; }

/* =================== POMPIER : rubriques en bas =================== */
.pp[data-onglet="accueil"] [data-tab]:not([data-tab="accueil"]),
.pp[data-onglet="dispos"] [data-tab]:not([data-tab="dispos"]),
.pp[data-onglet="planning"] [data-tab]:not([data-tab="planning"]) { display: none !important; }
.pp { padding: 0 16px calc(150px + env(safe-area-inset-bottom, 0px)); gap: 18px; }
.pp-tete { margin: 0 -16px; padding: 16px 16px 18px; background: var(--tete); color: var(--tete-texte); border-radius: 0 0 22px 22px; }
.pp-tete .marque-centre { color: inherit; opacity: .8; border-color: currentColor; }
.pp-tete .pp-nom { margin-top: 4px; font-size: 1.9rem; }
.pp-tete .pp-grade, .pp-tete .aide { color: inherit; opacity: .8; }
.pp-tete .btn-lien { color: inherit; }
.pp-tete .btn { background: transparent; color: inherit; border-color: color-mix(in srgb, currentColor 40%, transparent); }
.pp-tete .pp-message { background: color-mix(in srgb, currentColor 12%, transparent); border: 0; color: inherit; }
.pp-tete .pp-message-de { color: inherit; opacity: .75; }
.pp-carte { background: var(--surface); border: 1px solid var(--trait); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.pp-carte-titre { font-family: var(--f-titre); font-size: 1.35rem; display: inline-flex; align-items: center; gap: 6px; }
.astreinte { grid-template-columns: auto 1fr; column-gap: 14px; align-items: center; border-radius: 16px; padding: 12px 14px; }
.astreinte-date { grid-row: 1 / span 2; display: grid; justify-items: center; line-height: 1; font-family: var(--f-titre); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; background: var(--marine-texte); color: var(--marine); border-radius: 12px; padding: 7px 8px; min-width: 52px; }
.astreinte-date b { font-size: 1.7rem; font-weight: 700; margin: 2px 0; }
.astreinte:not(:first-child) { background: var(--surface); color: var(--encre); border: 1px solid var(--trait); }
.astreinte:not(:first-child) .astreinte-date { background: var(--marine-doux); }
.astreinte:not(:first-child) .astreinte-quand { color: var(--discret); }
.pp-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  background: var(--surface); border-top: 1px solid var(--trait); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -4px 16px rgba(18, 27, 37, .08);
}
.pp-nav .bb { border: 0; background: none; color: var(--discret); font: inherit; font-size: .74rem; font-weight: 600; display: grid; justify-items: center; gap: 3px; padding: 5px 0; cursor: pointer; }
.pp-nav .bb .ico { width: 24px; height: 24px; padding: 2px 14px; box-sizing: content-box; border-radius: 99px; }
.pp-nav .bb.actif { color: var(--marine); }
.pp-nav .bb.actif .ico { background: var(--marine-doux); }
.pp-barre { bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 24; }
.demo-telephone .pp-nav { position: sticky; border-radius: 0 0 26px 26px; margin: 0 -16px; }
.demo-telephone .pp-barre { margin: 0 -16px; }
.demo-telephone .pp-barre { position: sticky; bottom: 64px; border-radius: 0; }
.demo-telephone .pp { padding-bottom: 0; }
.demo-telephone .pp-tete { border-radius: 26px 26px 22px 22px; }

/* Dispos reçues : affichages « Cartes » et « Par semaine » */
.dispos-cartes { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.dc { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--trait); background: var(--surface); color: var(--encre); font: inherit; cursor: pointer; }
.dc-nom { font-weight: 600; min-width: 0; }
.dc-codes { display: flex; flex-wrap: wrap; gap: 3px; grid-column: 1; }
.dc-codes:empty { display: none; }
.dc-cases { display: flex; gap: 6px; grid-column: 1; }
.dc-sem { display: flex; gap: 2px; }
.dc-sem i { width: 14px; height: 14px; border-radius: 4px; background: var(--creux); border: 1px solid var(--trait); }
.dc-sem i.d { background: var(--ok); border-color: var(--ok); }
.dc-sem i.x { background: repeating-linear-gradient(45deg, var(--creux) 0 2px, var(--trait) 2px 4px); }
.dc-total { grid-column: 2; grid-row: 1 / span 3; font-family: var(--f-titre); font-weight: 700; font-size: 1.1rem; color: var(--ok); }
.dc-total.attention { color: var(--attention); font-size: .85rem; }
.ds-semaines { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); align-items: start; }
.ds-sem { background: var(--surface); border: 1px solid var(--trait); border-radius: 14px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.ds-sem h3 { font-size: 1.2rem; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.ds-sem h3 span { font-family: var(--f-texte); font-weight: 500; font-size: .82rem; color: var(--discret); }
.ds-bloc { display: grid; gap: 6px; border-top: 1px solid var(--trait); padding-top: 8px; }
.ds-bloc h4 { font-family: var(--f-titre); font-size: 1rem; margin: 0; display: flex; justify-content: space-between; }
.ds-bloc h4 span { color: var(--ok); }
.ds-besoins { display: flex; flex-wrap: wrap; gap: 4px; }
.ds-besoins:empty { display: none; }
.ds-besoin { font-size: .72rem; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
.ds-besoin.ok { background: var(--ok-doux); color: var(--ok); }
.ds-besoin.manque { background: var(--signal-doux); color: var(--signal); }
.ds-noms { display: flex; flex-wrap: wrap; gap: 4px; }
.ds-nom { border: 0; font: inherit; font-size: .84rem; font-weight: 500; padding: 3px 10px; border-radius: 99px; background: var(--creux); color: var(--encre); cursor: pointer; }
.ds-nom:hover { background: var(--marine-doux); }
.ds-nom.pref { background: var(--attention-doux); color: var(--attention); font-weight: 600; }
.rappel-zone { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.rappel-carte { display: grid; gap: 8px; background: var(--signal-doux); border: 1px solid color-mix(in srgb, var(--signal) 35%, transparent); border-radius: var(--rayon); padding: 14px 16px; }
.rappel-carte p { margin: 0; }
.rappel-titre { display: flex; align-items: center; gap: 8px; color: var(--signal); }
.rappel-noms { color: var(--encre); font-size: .9rem; }
.ch-per-mobile { display: none; }
@media (max-width: 760px) {
  /* Bandeau du haut : seulement le logo, le nom de l'appli et le centre. La période est dans la page. */
  .ch-entete { position: relative; overflow: hidden; padding: 16px 16px 18px; border-bottom: 4px solid var(--signal); }
  .ch-entete::after { content: ""; position: absolute; right: -40px; top: -40px; width: 150px; height: 150px; border-radius: 50%; background: color-mix(in srgb, var(--signal) 22%, transparent); pointer-events: none; }
  .ch-entete .ch-periode { display: none; }
  .ch-entete .ch-barre { justify-content: flex-start; }
  .ch-entete .marque { display: grid; grid-template-columns: auto 1fr; gap: 0 14px; align-items: center; position: relative; z-index: 1; }
  .ch-entete .marque-logo { grid-row: span 2; width: 58px; height: 58px; box-shadow: 0 0 0 3px var(--tete-texte), 0 0 0 6px var(--signal); }
  .ch-entete .marque-mot { font-size: 1.5rem; letter-spacing: .12em; line-height: 1.1; }
  .ch-entete .marque-centre { border: 0; padding: 0; font-size: 1.05rem; opacity: .85; letter-spacing: .04em; }
  .ch-per-mobile { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; }
  .ch-per-mobile strong { font-family: var(--f-titre); font-size: 1.1rem; text-align: center; flex: 1; }
  .ch-per-mobile .btn-icone { width: 34px; min-height: 34px; border-radius: 50%; }
  .ch-per-mobile .btn-lien { flex-basis: 100%; text-align: center; }
  .rappel-carte .btn-primaire { flex: 1 1 100%; justify-content: center; }
}

/* Réglages, compétences et besoins : boutons − / + pour les minimums */
.pas { display: inline-flex; align-items: center; gap: 4px; }
.pas .btn-icone { width: 34px; min-height: 34px; font-size: 1.1rem; border-radius: 50%; }
.effectif-min { display: flex; flex-wrap: wrap; gap: 8px 32px; }
.effectif-min .pas input.nombre,
.table-qualifs .pas input.nombre { width: 54px; text-align: center; -moz-appearance: textfield; }
.pas input::-webkit-outer-spin-button, .pas input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
@media (max-width: 760px) {
  /* Une carte par compétence au lieu d'un tableau large. */
  .table-qualifs { min-width: 0; width: 100%; }
  .table-qualifs thead { display: none; }
  .table-qualifs, .table-qualifs tbody { display: block; }
  .table-qualifs tbody { display: grid; gap: 10px; }
  .table-qualifs tr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px 10px; background: var(--surface); border: 1px solid var(--trait); border-radius: 14px; padding: 10px 12px; }
  .table-qualifs td, .table-qualifs tbody td, .table-qualifs tbody tr:nth-child(even) td, .table-qualifs tbody tr td:first-child { display: grid; gap: 3px; padding: 0; border: 0; min-width: 0; background: none; }
  .table-qualifs tbody tr { border-left: 5px solid var(--encre); }
  .table-qualifs tbody tr:nth-child(even) { background: var(--fond); border-left-color: var(--discret); }
  .table-qualifs td[data-l]::before { content: attr(data-l); font-size: .72rem; font-weight: 600; color: var(--discret); text-transform: uppercase; letter-spacing: .05em; }
  .table-qualifs .q-nom { grid-column: 1 / 3; grid-row: 1; }
  .table-qualifs .q-ordre { grid-column: 3; grid-row: 1 / 3; display: flex; flex-direction: column; gap: 4px; align-self: start; }
  .table-qualifs .q-code { grid-column: 1; grid-row: 2; }
  .table-qualifs .q-code input.court { width: 100%; }
  .table-qualifs .q-inclut { grid-column: 1 / -1; grid-row: 3; }
  .table-qualifs .q-we { grid-column: 1; grid-row: 4; }
  .table-qualifs .q-se { grid-column: 2; grid-row: 4; }
  .table-qualifs .q-suppr { grid-column: 3; grid-row: 4; align-self: end; }
  .table-qualifs .q-suppr .btn { color: var(--signal); }
}

/* Feuille modifiable : où le pompier est dispo, panneau d'ajout, manques par semaine */
.f-case.dispo { display: grid; place-items: center; }
.f-case.dispo i, .f-leg-dispo i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.f-case.ici i { display: none; }
.f-leg-dispo { white-space: nowrap; }
.f-ajout { border: 1.5px dashed var(--trait); background: transparent; color: var(--discret); font: inherit; font-size: .82rem; font-weight: 600; border-radius: 99px; padding: 4px 12px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; justify-self: start; margin-top: 2px; }
.f-ajout:hover { border-color: var(--marine); color: var(--marine); }
.f-ajout .ico { width: 14px; height: 14px; }
.f-panneau { display: grid; gap: 8px; border: 1px solid var(--marine); border-radius: 12px; padding: 10px; background: var(--fond); margin-top: 4px; }
.f-panneau-tete { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .85rem; }
.f-panneau-tete .btn-icone { width: 28px; min-height: 28px; }
.f-panneau summary { cursor: pointer; font-size: .8rem; color: var(--discret); padding: 4px 0; }
.f-cands { display: grid; gap: 4px; max-height: 260px; overflow-y: auto; }
.f-cand { display: grid; text-align: left; gap: 0; border: 1px solid var(--trait); background: var(--surface); color: var(--encre); font: inherit; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.f-cand:hover { border-color: var(--marine); }
.f-cand span { font-weight: 600; font-size: .88rem; }
.f-cand small { font-size: .74rem; color: var(--discret); }
.f-cand.r3 { border-left: 4px solid var(--ok); }
.f-cand.r2 { border-left: 4px solid var(--attention); }
.f-manques { margin: 0; padding: 6px 8px 6px 22px; background: var(--signal-doux); color: var(--signal); border-radius: 8px; font-size: .78rem; font-weight: 600; display: grid; gap: 1px; }
.f-complet { margin: 0; font-size: .78rem; font-weight: 600; color: var(--ok); }

/* Bilan du planning : un verdict en couleur et des tuiles, à la place de la note sur 100. */
.bilan { display: grid; gap: 10px; }
.bilan-verdict { margin: 0; display: flex; align-items: center; gap: 10px; font-family: var(--f-titre); font-weight: 700; font-size: 1.35rem; }
.bilan-rond { width: 16px; height: 16px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 5px var(--ok-doux); }
.bilan-verdict.moy .bilan-rond { background: var(--attention); box-shadow: 0 0 0 5px var(--attention-doux); }
.bilan-verdict.bas .bilan-rond { background: var(--signal); box-shadow: 0 0 0 5px var(--signal-doux); }
.bilan-tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.bilan-t { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 0 8px; padding: 10px 12px; border-radius: 12px; background: var(--ok-doux); color: var(--ok); }
.bilan-t .ico { grid-row: span 2; width: 22px; height: 22px; }
.bilan-t strong { font-family: var(--f-titre); font-size: 1.5rem; line-height: 1.1; }
.bilan-t span { font-size: .78rem; color: var(--encre); }
.bilan-t.moy { background: var(--attention-doux); color: var(--attention); }
.bilan-t.bas { background: var(--signal-doux); color: var(--signal); }
.carte-manques summary { list-style: none; }
.carte-manques summary::-webkit-details-marker { display: none; }
.mq-lignes { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.mq-lignes li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; background: var(--surface); border-radius: 8px; padding: 5px 8px; }
.mq-quand { font-weight: 600; font-size: .85rem; min-width: 9em; }
.mq-liste { display: flex; flex-wrap: wrap; gap: 4px; }
.mq { font-size: .74rem; font-weight: 700; padding: 1px 7px; border-radius: 99px; }
.mq-rouge { background: var(--signal); color: var(--sur-signal); }
.mq-orange { background: var(--attention); color: var(--sur-signal); }
.mq-legende { margin: 0; font-size: .8rem; color: var(--discret); line-height: 1.7; }
@media (max-width: 760px) { .bilan-tuiles { grid-template-columns: 1fr 1fr; } }

/* Durée du planning : 4 ou 5 semaines, juste avant « Générer ». */
.duree-bloc { display: grid; gap: 6px; justify-items: start; }
.duree .vue { flex-direction: column; gap: 0; padding: 6px 22px; line-height: 1.1; }
.duree .vue strong { font-family: var(--f-titre); font-size: 1.5rem; }
.duree .vue span { font-size: .75rem; font-weight: 500; }
.duree .vue:disabled { opacity: .5; cursor: not-allowed; }
.duree-bloc .aide { margin: 0; }
.avis-s5 { margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: .88rem; padding: 8px 12px; border-radius: 10px; }
.avis-s5 .ico { flex: none; margin-top: 2px; }
.avis-s5.ok { background: var(--ok-doux); color: var(--ok); }
.avis-s5.non { background: var(--attention-doux); color: var(--attention); }
.avis-s5 span { color: var(--encre); } .avis-s5 strong { display: block; }
/* Pompier : la 5e semaine, en option. */
/* Semaine 5 : bloc à part, couleur « attention », car le planning de 5 semaines n'est pas certain. */
.sem5-zone { display: grid; gap: 10px; margin-top: 8px; padding: 12px; border-radius: 14px; border: 2px dashed var(--attention); background: var(--attention-doux); }
.sem-option { display: grid; gap: 4px; font-size: .9rem; }
.sem-option strong { display: flex; align-items: center; gap: 6px; color: var(--attention); font-family: var(--f-titre); font-size: 1.05rem; text-transform: uppercase; letter-spacing: .03em; }
.sem-option strong svg { width: 18px; height: 18px; flex: none; }
.sem-option span { color: var(--encre); }
.sem-5 .sem-num { color: var(--attention); }
.recap-option { font-size: .75rem; font-weight: 600; color: var(--discret); background: var(--creux); border-radius: 99px; padding: 1px 7px; }
.demo-barre .btn.btn-simulation { background: #F5B800; color: #121B25; border-color: #F5B800; font-weight: 700; box-shadow: 0 0 0 3px rgba(245, 184, 0, .3); }
.demo-barre .btn.btn-simulation:hover { background: #FFC929; }
/* Équipe : qui a activé les notifications. */
.notif-bilan { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--rayon); font-size: .9rem; }
.notif-bilan .ico { flex: none; margin-top: 2px; }
.notif-bilan strong { display: block; }
.notif-bilan.ok { background: var(--ok-doux); color: var(--ok); }
.notif-bilan.non { background: var(--attention-doux); }
.notif-bilan.non .ico, .notif-bilan.non strong { color: var(--attention); }
.liste .col-notif { text-align: center; white-space: nowrap; }
